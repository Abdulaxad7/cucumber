spring:
  config:
    # DEV ONLY: JWT_SECRET and AUTH_DB_PASSWORD come from the gitignored .env in the repository root
    # (see .env.example), or from the environment. ../.env covers runs from the auth-service directory.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  # DEV ONLY: the local development database (a postgres:17 container on localhost:5432, see the README).
  # The password is AUTH_DB_PASSWORD, read through application.yaml; it is never committed.
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service
    username: auth_service
logging:
  level:
    # SQL statements go through the logging system, with request and user ids and ? placeholders only (FU-14, E78).
    org.hibernate.SQL: DEBUG
