spring:
  application:
    name: auth-service
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  jpa:
    database: h2
    open-in-view: false
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        #        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: admin
    password: admin
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false



server:
  port: 8081

app:
  jwtSecret: ${JWT_SECRET}
  jwtExpirationInMs: 86400000
  orgs:
    free-seat-limit: 5

